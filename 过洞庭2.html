<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洞庭泛舟·心学试炼</title>
    <style>
        /* --- 全局古风样式 --- */
        body {
            margin: 0;
            padding: 0;
            font-family: "KaiTi", "楷体", serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmZmZmIi8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNjY2NjY2MiLz4KPC9zdmc+');
        }

        /* --- 游戏主容器 --- */
        #game-container {
            width: 600px;
            height: 800px;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            border: 8px solid #4a3b2a;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 顶部状态栏 --- */
        #header {
            background-color: rgba(62, 39, 35, 0.9);
            color: #f4f4f4;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #d7ccc8;
            z-index: 20;
            backdrop-filter: blur(2px);
        }

        /* --- 场景展示区 --- */
        #scene {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* 1. 月亮 */
        .moon {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 40px #fff, 0 0 80px #aaddff;
            opacity: 0.9;
            z-index: 1;
        }

        /* 2. 远山 */
        .mountains {
            position: absolute;
            bottom: 30%;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 2;
            opacity: 0.6;
            filter: blur(1px);
        }

        /* 3. 水面容器 */
        .water-surface {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            z-index: 3;
            overflow: hidden;
        }

        /* 波浪通用样式 */
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
            background-size: 50% 100%;
            opacity: 0.8;
        }

        /* 第一层波浪 */
        .wave-1 {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDEyMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSI+PHBhdGggZD0iTTAgMTIwTDE1MCA5MEwzMDAgMTEwTDQ1MCA3MEw2MDAgMTAwTDc1MCA2MEw5MDAgOTBMMTA1MCA1MEwxMjAwIDEyMFoiIGZpbGw9IiM0NWE2YjMiIG9wYWNpdHk9IjAuNiIvPjwvc3ZnPg==');
            animation: wave-flow 10s linear infinite;
        }

        /* 第二层波浪 */
        .wave-2 {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDEyMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSI+PHBhdGggZD0iTTAgMTIwTDE1MCA5MEwzMDAgMTEwTDQ1MCA3MEw2MDAgMTAwTDc1MCA2MEw5MDAgOTBMMTA1MCA1MEwxMjAwIDEyMFoiIGZpbGw9IiMzMjg0OWQiIG9wYWNpdHk9IjAuOCIvPjwvc3ZnPg==');
            animation: wave-flow 7s linear infinite reverse;
            bottom: -10px;
            opacity: 0.9;
        }

        /* 4. 插画样式 */
        .boat-illustration {
            width: 280px;
            height: auto;
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.4));
        }

        /* 5. 怪物/障碍 */
        .monster {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: absolute;
            top: 35%;
            left: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            animation: pulse 3s infinite;
            z-index: 5;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        /* --- 对话框与题目区 --- */
        #dialogue-box {
            background-color: #fffdf5;
            border-top: 6px solid #3e2723;
            padding: 25px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            border-radius: 15px 15px 0 0;
        }

        #question-text {
            font-size: 1.4rem;
            color: #2c2c2c;
            margin-bottom: 25px;
            line-height: 1.6;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #5d4037;
            width: 90%;
            box-shadow: 3px 3px 0 #5d4037;
        }

        /* --- 选项按钮 --- */
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 95%;
        }

        .option-btn {
            background: #3e2723;
            color: #f4f4f4;
            border: 2px solid #281815;
            padding: 15px;
            font-size: 1.1rem;
            font-family: "KaiTi", serif;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #281815;
            position: relative;
            top: 0;
        }

        .option-btn:hover {
            background: #5d4037;
            top: -2px;
        }

        .option-btn:active {
            top: 4px;
            box-shadow: none;
        }

        /* --- 反馈动画 --- */
        .correct { background-color: #2e7d32 !important; border-color: #1b5e20 !important; box-shadow: 0 4px 0 #1b5e20 !important; }
        .wrong { background-color: #c62828 !important; border-color: #b71c1c !important; box-shadow: 0 4px 0 #b71c1c !important; animation: shake 0.5s; }

        /* --- 动画定义 --- */
        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            50% { transform: translateX(-50%) translateY(-15px) rotate(1deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        @keyframes wave-flow {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- 通关界面 --- */
        #victory-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
        #victory-screen h1 { color: #d32f2f; font-size: 3.5rem; margin: 0; text-shadow: 2px 2px 0 #3e2723; }
        #victory-screen p { font-size: 1.5rem; color: #333; margin-top: 10px; }
        .restart-btn {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 1.2rem;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: "KaiTi", serif;
            box-shadow: 0 4px 0 #b71c1c;
        }
        .restart-btn:active { transform: translateY(4px); box-shadow: none; }

    </style>
</head>
<body>

<div id="game-container">
    <!-- 顶部状态 -->
    <div id="header">
        <span id="level-indicator">第一重境：初入洞庭</span>
        <span>心境值：<span id="hp">100</span></span>
    </div>

    <!-- 场景画面 -->
    <div id="scene">
        <!-- 月亮 -->
        <div class="moon"></div>
        
        <!-- 远山 -->
        <svg class="mountains" viewBox="0 0 600 200" preserveAspectRatio="none">
            <path d="M0,200 L0,100 Q100,50 200,120 T400,80 T600,150 L600,200 Z" fill="#1a2a3a" opacity="0.8"/>
            <path d="M-50,200 L100,80 Q250,20 400,100 T650,60 L650,200 Z" fill="#2c3e50" opacity="0.6"/>
        </svg>

        <!-- 怪物 -->
        <div id="monster" class="monster">🌫️</div>

        <!-- 水面波浪 -->
        <div class="water-surface">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
        </div>

        <!-- 小船插画 -->
        <div class="boat-illustration">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
                <!-- 船身 -->
                <path d="M50,220 Q250,280 450,220 L440,240 Q250,300 60,240 Z" fill="#5D4037" />
                <path d="M60,240 Q250,280 440,240 L430,250 Q250,290 70,250 Z" fill="#3E2723" />
                <!-- 船舱 -->
                <path d="M150,220 L350,220 L340,240 L160,240 Z" fill="#8D6E63" opacity="0.8"/>
                
                <!-- 人物 -->
                <g transform="translate(180, 160)">
                    <path d="M20,60 Q40,80 60,60 L60,90 L20,90 Z" fill="#FFCC80" />
                    <path d="M15,70 Q40,90 65,70 L70,100 L10,100 Z" fill="#1976D2" />
                    <circle cx="40" cy="50" r="20" fill="#FFCC80" />
                    <path d="M10,40 Q40,10 70,40 Z" fill="#212121" />
                    <path d="M5,40 Q40,50 75,40 L70,35 Q40,45 10,35 Z" fill="#424242" />
                    <path d="M25,55 Q40,65 55,55" fill="none" stroke="#212121" stroke-width="2" />
                </g>

                <!-- 船桨 -->
                <rect x="300" y="150" width="10" height="150" transform="rotate(20 300 150)" fill="#795548" />
                <ellipse cx="315" cy="280" rx="20" ry="40" transform="rotate(20 315 280)" fill="#5D4037" />
            </svg>
        </div>
    </div>

    <!-- 题目与选项 -->
    <div id="dialogue-box">
        <div id="question-text">
            题目加载中...
        </div>
        <div class="options-container" id="options-area">
            <!-- 按钮将通过JS生成 -->
        </div>
    </div>

    <!-- 通关界面 -->
    <div id="victory-screen">
        <h1>通关！</h1>
        <p>恭喜少侠习得《念奴娇·过洞庭》！</p>
        <p>获得称号：【洞庭词仙】</p>
        <button class="restart-btn" onclick="location.reload()">再玩一次</button>
    </div>
</div>

<script>
    // --- 游戏数据 ---
    const levels = [
        {
            levelName: "第一重境：初入洞庭",
            monsterIcon: "🌫️",
            monsterName: "迷雾水怪",
            question: "水怪遮住了湖面，请吟诵描写“湖面广阔、水月交辉”的诗句驱散迷雾！",
            correct: "玉鉴琼田三万顷，着我扁舟一叶",
            options: [
                "玉鉴琼田三万顷，着我扁舟一叶",
                "洞庭青草，近中秋、更无一点风色",
                "短发萧骚襟袖冷，稳泛沧浪空阔"
            ]
        },
        {
            levelName: "第二重境：沧浪泛舟",
            monsterIcon: "🌬️",
            monsterName: "萧瑟寒风",
            question: "寒风来袭，请用表现“胸襟旷达、稳坐钓鱼台”的诗句来稳住小舟！",
            correct: "短发萧骚襟袖冷，稳泛沧浪空阔",
            options: [
                "尽挹西江，细斟北斗",
                "短发萧骚襟袖冷，稳泛沧浪空阔",
                "扣舷独啸，不知今夕何夕"
            ]
        },
        {
            levelName: "第三重境：冰雪丹心",
            monsterIcon: "👻",
            monsterName: "心魔幻影",
            question: "心魔质疑你的清白，请用表明“肝胆相照、内心高洁”的诗句反击！",
            correct: "应念岭海经年，孤光自照，肝胆皆冰雪",
            options: [
                "素月分辉，明河共影，表里俱澄澈",
                "悠然心会，妙处难与君说",
                "应念岭海经年，孤光自照，肝胆皆冰雪"
            ]
        },
        {
            levelName: "第四重境：万象宾客",
            monsterIcon: "🌑",
            monsterName: "孤独黑雾",
            question: "孤独感袭来，请吟诵“邀请万象为宾客”的豪迈诗句，点亮星空！",
            correct: "尽挹西江，细斟北斗，万象为宾客",
            options: [
                "尽挹西江，细斟北斗，万象为宾客",
                "玉鉴琼田三万顷，着我扁舟一叶",
                "短发萧骚襟袖冷，稳泛沧浪空阔"
            ]
        },
        {
           levelName: "第五重境：物我两忘",
            monsterIcon: "⏳",
            monsterName: "世俗时间",
            question: "冲破时间的束缚，达到物我两忘的境界，请念出最后的通关咒语！",
            correct: "扣舷独啸，不知今夕何夕",
            options: [
                "悠然心会，妙处难与君说",
                "扣舷独啸，不知今夕何夕",
                "表里俱澄澈"
            ]
        }
    ];

    // --- 游戏状态 ---
    let currentLevelIndex = 0;
    let hp = 100;

    // --- DOM 元素 ---
    const levelIndicator = document.getElementById('level-indicator');
    const hpDisplay = document.getElementById('hp');
    const questionText = document.getElementById('question-text');
    const optionsArea = document.getElementById('options-area');
    const monsterEl = document.getElementById('monster');
    const victoryScreen = document.getElementById('victory-screen');

    // --- 初始化游戏 ---
    function initGame() {
        loadLevel(currentLevelIndex);
    }

    // --- 加载关卡 ---
    function loadLevel(index) {
        if (index >= levels.length) {
            showVictory();
            return;
        }

        const levelData = levels[index];
        
        // 更新UI
        levelIndicator.innerText = levelData.levelName;
        monsterEl.innerText = levelData.monsterIcon;
        questionText.innerText = levelData.question;
        
        // 清空旧选项
        optionsArea.innerHTML = '';

        // 生成选项按钮
        levelData.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(btn, option, levelData.correct);
            optionsArea.appendChild(btn);
        });
    }

    // --- 检查答案 ---
    function checkAnswer(btnElement, selectedOption, correctOption) {
        // 防止重复点击
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selectedOption === correctOption) {
            // 答对了
            btnElement.classList.add('correct');
            // 怪物消失动画
            monsterEl.style.transform = "scale(0)";
            monsterEl.style.opacity = "0";
            
            setTimeout(() => {
                currentLevelIndex++;
                monsterEl.style.transform = "scale(1)"; // 重置怪物状态
                monsterEl.style.opacity = "0.6";
                loadLevel(currentLevelIndex);
            }, 1000);
        } else {
            // 答错了
            btnElement.classList.add('wrong');
            hp -= 20;
            hpDisplay.innerText = hp;
            
            // 震动反馈
            const container = document.getElementById('game-container');
            container.style.transform = "translateX(10px)";
            setTimeout(() => container.style.transform = "translateX(0)", 100);

            if (hp <= 0) {
                alert("心境破碎，少侠请重新来过！");
                location.reload();
            } else {
                // 允许重试
                setTimeout(() => {
                    btnElement.classList.remove('wrong');
                    allBtns.forEach(b => b.disabled = false);
                }, 500);
            }
        }
    }

    // --- 通关画面 ---
    function showVictory() {
        victoryScreen.style.display = 'flex';
        // 简单的礼花效果（通过改变背景色模拟）
        document.body.style.backgroundColor = "#ffeb3b";
    }

    // 启动
    initGame();
</script>

</body>
</html>
